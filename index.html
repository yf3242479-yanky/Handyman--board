var RTAGS=['Pays on time','Friendly','Easy to work with','Clear about the work','Messy or unprepared','Pays late','Difficult','Changed the job'];
var RCOLS=['','#eb5a46','#ff9f1a','#f2d600','#51e898','#61bd4f'],RLABS=['','Very bad','Not good','OK','Good','Great'];
function rk(n){return Math.max(1,Math.min(5,Math.round(Number(n)||0)))}
function rcol(n){return RCOLS[rk(n)]}
function rtx(n){return rk(n)==1?'#fff':'#172b4d'}
function stars(n){var k=rk(n);return '<span class="tag" style="background:'+RCOLS[k]+';color:'+rtx(k)+';margin:0;padding:3px 12px;font-size:13px;border-radius:12px">'+RLABS[k]+'</span>'}

 return '<div class="sec"><h4>Worker ratings '+stars(r.avg)+' <span class="m">('+r.n+')</span></h4>'+r.L.sort(function(a,b){return (b.cat||0)-(a.cat||0)}).map(function(j){return '<div class="r2"'+((ROLE=='owner'||J.indexOf(j)>-1)?' data-j="'+j.id+'"':' style="cursor:default"')+'><div style="flex:1;min-width:0"><div>'+stars(j.crate)+'</div><div class="m">'+esc((j.ctags||[]).join(' · '))+'</div>'+(j.cnote?'<div>'+esc(j.cnote)+'</div>':'')+'<div class="m">'+esc(j.cby||'')+' · '+esc(j.job||'')+'</div></div></div>'}).join('')+'</div>'}

function ingest(col,snap){
 var team=col=='jobs'&&ROLE!='owner',arr=col=='jobs'?J:col=='customers'?CU:col=='stock'?STK:col=='templates'?TPL:col=='expenses'?EXP:col=='tools'?TLS:W,seen={},tseen={};SY[col]={};

  if(team&&x.wuid!=AU.uid&&x.wuid2!=AU.uid){TJ.push(x);return}
