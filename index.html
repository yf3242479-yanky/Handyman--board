<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleishman handyman</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#0079bf;--list:#ebecf0;--card:#fff;--tx:#172b4d;--mu:#5e6c84;--bd:#dfe1e6;--modal:#f4f5f7;--hov:#f4f5f7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c3b66;--list:#101204;--card:#22272b;--tx:#b6c2cf;--mu:#8c9bab;--bd:#38414a;--modal:#1d2125;--hov:#2c333a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c3b66;--list:#101204;--card:#22272b;--tx:#b6c2cf;--mu:#8c9bab;--bd:#38414a;--modal:#1d2125;--hov:#2c333a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:#fff;padding:8px 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(0,0,0,.45);z-index:6}
.row{display:flex;gap:8px;align-items:center}
h1{font-size:18px;margin:0;flex:1}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{border:0;background:var(--hov);border-radius:3px;padding:7px 12px;cursor:pointer;font-weight:500}
.top button,.top select{background:rgba(255,255,255,.25);color:#fff;border:0;border-radius:3px;padding:6px 10px;white-space:nowrap}.top option{color:#172b4d}
button.p{background:#0c66e4;color:#fff}.top button.p{background:#0c66e4}
input,select,textarea{width:100%;padding:8px 10px;border:2px solid var(--bd);border-radius:3px;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:0;border-color:#388bff}
.top input{background:rgba(255,255,255,.3);color:#fff;border:0;margin-top:8px}.top input::placeholder{color:#e6eef5}
.tools{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.stats{display:flex;gap:6px;margin-top:8px;overflow-x:auto;font-size:12px}
.stats span{white-space:nowrap;background:rgba(255,255,255,.2);border-radius:3px;padding:3px 8px}
.view{display:none}.view.on{display:block}
#board.on{display:flex}
#board{gap:8px;align-items:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px;min-height:calc(100vh - 220px)}
.list{flex:0 0 272px;scroll-snap-align:start;background:var(--list);border-radius:12px;padding:4px 0 6px;max-height:calc(100vh - 230px);display:flex;flex-direction:column}
.list.over{outline:3px solid #388bff}
.lh{display:flex;justify-content:space-between;padding:8px 12px 6px;font-weight:600;font-size:14px}.cnt{color:var(--mu);font-weight:400}
.cs{overflow-y:auto;padding:0 6px;min-height:8px}
.card{background:var(--card);border-radius:8px;box-shadow:0 1px 1px rgba(9,30,66,.25),0 0 1px rgba(9,30,66,.31);padding:8px 10px 6px;margin-bottom:8px;cursor:pointer;position:relative;display:block}
.card:hover{background:var(--hov)}
.lb{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px}
.lb span{font-size:11px;font-weight:700;color:#fff;border-radius:4px;padding:1px 8px;line-height:16px;min-width:40px;text-align:center}
.card .t{font-size:14px;font-weight:500;word-wrap:break-word}.card .d{font-size:12px;color:var(--mu);margin-top:2px}
.bd{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px;padding-right:34px;min-height:24px}
.bg{font-size:12px;color:var(--mu);padding:2px 5px;border-radius:3px;display:inline-flex;gap:3px;align-items:center}
.bg.soon{background:#f5cd47;color:#172b4d}.bg.od{background:#c9372c;color:#fff}.bg.ok{background:#4bce97;color:#172b4d}.bg.run{background:#4bce97;color:#172b4d;font-weight:700}
.av{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.lane{background:var(--list);border-radius:12px;padding:6px 8px 8px;margin-bottom:12px}.lane.over{outline:3px solid #388bff}.lane h3{margin:6px 4px;display:flex;align-items:center;gap:8px;font-size:15px}.dh{font-size:12px;font-weight:700;color:var(--mu);margin:8px 4px 4px;text-transform:uppercase}.dh.od{color:#c9372c}.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;transform:rotate(3deg);box-shadow:0 8px 20px rgba(0,0,0,.4);margin:0}
.ct{font-size:13px;margin-top:4px}.ct a{color:var(--tx);text-decoration:none;display:block;padding:2px 0}
.qa{display:flex;gap:6px;margin-top:6px;padding-right:34px}.qa a{flex:1;text-align:center;padding:7px 0;background:var(--hov);border:1px solid var(--bd);border-radius:6px;color:var(--tx);text-decoration:none;font-size:12px;font-weight:600}
.add{margin:2px 6px 0;text-align:left;background:transparent;color:var(--mu);padding:8px}.add:hover{background:rgba(9,30,66,.12)}
.pg{padding:10px;max-width:640px;margin:0 auto}
.pg h2{color:#fff;font-size:13px;margin:12px 4px 6px;text-transform:uppercase;letter-spacing:.5px}
.r2{background:var(--card);border-radius:8px;padding:10px;margin-bottom:6px;display:flex;gap:10px;align-items:center;cursor:pointer;box-shadow:0 1px 1px rgba(9,30,66,.25)}
.r2:hover{background:var(--hov)}
.av2{width:38px;height:38px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.m{font-size:12px;color:var(--mu)}
.sum{background:rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:10px;margin-bottom:8px;display:flex;gap:14px;flex-wrap:wrap}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:var(--list);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;border-radius:0;padding:10px 0;font-size:12px;color:var(--mu)}.nav button.on{color:#0c66e4;font-weight:700}
.nav b{display:block;font-size:20px;font-weight:400}
#m{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:10;overflow:auto;padding:12px}
.box{background:var(--modal);border-radius:8px;padding:16px;max-width:560px;margin:0 auto 20px}
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:12px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec{margin-top:14px}.sec h4{margin:0 0 6px;font-size:14px}
.pill{display:inline-block;color:#fff;font-weight:700;font-size:12px;border-radius:4px;padding:3px 12px}
.tbox{background:var(--card);border-radius:8px;padding:12px;text-align:center;box-shadow:0 1px 1px rgba(9,30,66,.25)}
.btns{display:flex;gap:6px;flex-wrap:wrap}.btns>*{flex:1 1 40%;text-align:center}
a.b{display:block;padding:7px 12px;background:var(--hov);border-radius:3px;color:var(--tx);text-decoration:none;font-weight:500}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:4px;padding:0 6px;margin-left:4px}
</style><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0079bf">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head><body>
<div class="top">
 <div class="row"><h1>🔧 Handyman Board <span id="net" style="font-size:11px;font-weight:400"></span></h1><button class="p" id="add">+ New</button></div>
 <input id="q" placeholder="Search jobs…">
 <div class="tools" id="bt"><select id="gb" style="width:auto"><option value="status">Group: Status</option><option value="color">Group: Priority</option><option value="wid">Group: Worker</option></select><select id="wf" style="width:auto"></select><button id="td">Today</button><button id="fu">Follow-ups</button><button id="bk">Account</button></div>
 <div class="stats" id="st"></div>
</div>
<div id="board" class="view on"></div>
<div id="cust" class="view"></div>
<div id="work" class="view"></div>
<div id="sched" class="view"></div>
<div class="nav"><button data-v="board" class="on"><b>📋</b>Jobs</button><button data-v="cust"><b>👥</b>Customers</button><button data-v="work"><b>👷</b>Workers</button><button data-v="sched"><b>📅</b>Schedule</button></div>
<div id="auth" style="position:fixed;inset:0;z-index:30;background:var(--bg,#f4f5f7);overflow:auto;padding:20px;display:block"><div id="ab" style="background:var(--modal,#fff);color:var(--tx);max-width:420px;margin:20px auto;padding:20px;border-radius:12px"></div></div>
<div id="m"><div class="box" id="box"></div></div>
<script>
var S=['New Lead','Scheduled','In Progress','Done','Paid'];
var C={red:['#eb5a46','Urgent'],orange:['#ff9f1a','Soon'],green:['#61bd4f','Normal'],blue:['#0079bf','Low priority']};
var PAL=['#0c66e4','#e56910','#6a9a23','#ae4787','#00a3bf','#c9372c'];
var TODAY=false,MR=0.7,VIEW='board',WF='all',dragId=null,GB='status',MOPEN=false,NOCLICK=false,DG=null;
try{MR=Number(localStorage.getItem('hm_mrate'))||0.7}catch(e){}
function ld(k){try{var v=localStorage.getItem(k);return v===null?null:JSON.parse(v)}catch(e){return null}}
var J=[],CU=[],W=[];
var DB=null,AU=null,ROLE='',ME=null,MYW='',UNS=[],SEC=null,CREATING=false,PENDMSG='';
function D(d,h){var x=new Date();x.setDate(x.getDate()+d);var p=function(n){return ('0'+n).slice(-2)};return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate())+'T'+p(h)+':00'}
var SY={jobs:{},customers:{},workers:{}},ERRSHOWN=false;
function fe(e){if(ERRSHOWN)return;ERRSHOWN=true;setTimeout(function(){ERRSHOWN=false},8000);alert('Sync problem: '+(e&&e.message||e))}
function cln(x){return JSON.parse(JSON.stringify(x))}
function sync(col,arr){if(!DB)return;var seen={};arr.forEach(function(x){if(col=='jobs'){var w=wk(x.wid);x.wuid=w&&w.uid?w.uid:''}var id=String(x.id),c=cln(x),t=JSON.stringify(c);seen[id]=1;if(SY[col][id]!==t){SY[col][id]=t;DB.collection(col).doc(id).set(c).catch(fe)}});Object.keys(SY[col]).forEach(function(id){if(!seen[id]){delete SY[col][id];DB.collection(col).doc(id).delete().catch(fe)}})}
function save(){if(!DB||!ROLE)return;sync('jobs',J);if(ROLE=='owner'){sync('customers',CU);sync('workers',W)}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '$'+(Number(n)||0).toLocaleString()}
function find(id){return J.filter(function(j){return j.id==id})[0]}
function cu(id){return CU.filter(function(c){return c.id==id})[0]}
function wk(id){return W.filter(function(w){return w.id==id})[0]}
function nid(a){return Date.now()}
function ini(n){return String(n).split(' ').map(function(w){return w[0]||''}).join('').slice(0,2).toUpperCase()}
function g(i){return document.getElementById(i)}
function bind(s,f){[].forEach.call(document.querySelectorAll(s),function(e){e.onclick=function(ev){ev.stopPropagation();f(e)}})}
function fmt(s){s=Math.floor(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return h+':'+('0'+m).slice(-2)+':'+('0'+r).slice(-2)}
function cur(j){return (j.secs||0)+(j.tStart?(Date.now()-j.tStart)/1000:0)}
function el(j){return (j.logged||0)+cur(j)}
function stopT(j){j.secs=cur(j);j.tStart=0}
function finishT(j){var s=Math.round(cur(j));j.tStart=0;j.secs=0;if(s>=1){j.log=j.log||[];j.log.push({t:Date.now(),secs:s,by:(ME&&ME.name)||'',wid:MYW||j.wid||''});j.logged=(j.logged||0)+s}}
function hm(s){s=Math.round(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+' hr '+m+' min':(m?m+' min':(s>0?'under 1 min':'0 min'))}
function logHTML(j){var L=j.log||[];if(!L.length)return '';return '<div class="m" style="margin-top:8px"><b>Saved work time</b></div>'+L.slice().reverse().map(function(e){return '<div class="m">'+new Date(e.t).toLocaleDateString([], {month:'short',day:'numeric'})+' · '+hm(e.secs)+(e.by?' · '+esc(e.by):'')+'</div>'}).join('')+'<div class="m"><b>Total on this job: '+hm(el(j))+'</b></div>'}
function labor(j){return Number(j.rate)>0?Math.round(el(j)/3600*Number(j.rate)*100)/100:(Number(j.price)||0)}
function total(j){return labor(j)+(Number(j.mats)||0)}
function amt(j){return j.status=='Paid'&&j.paidAmt!=null?j.paidAmt:total(j)}
function touch(j){if((j.status=='Done'||j.status=='Paid')&&(j.tStart||j.secs))finishT(j);if(j.status=='Paid'&&!j.paidOn)j.paidOn=Date.now()}
function when(j){return new Date(j.date).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function isToday(j){return j.date&&j.date.slice(0,10)==D(0,0).slice(0,10)}
function wcol(w){return w?PAL[(w.col||0)%PAL.length]:'#8590a2'}
function show(){if(!MOPEN){MOPEN=true;try{history.pushState({m:1},'')}catch(e){}}g('box').insertAdjacentHTML('afterbegin','<button id="bkb" style="margin-bottom:10px">← Back</button>');g('bkb').onclick=close;g('m').style.display='block';g('m').scrollTop=0}
function close(){g('m').style.display='none';if(MOPEN){MOPEN=false;try{if(history.state&&history.state.m)history.back()}catch(e){}}}
window.addEventListener('popstate',function(){if(MOPEN){MOPEN=false;g('m').style.display='none'}});
function ct(j){return (j.phone?'<div class="ct"><a href="tel:'+esc(j.phone)+'">📞 '+esc(j.phone)+'</a></div>':'')+(j.addr?'<div class="ct"><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(j.addr)+'" target="_blank">📍 '+esc(j.addr)+'</a></div>':'')}
function qa(j){if(!j.phone&&!j.addr)return '';return '<div class="qa">'+(j.phone?'<a href="tel:'+esc(j.phone)+'">📞 Call</a><a href="sms:'+esc(j.phone)+'">💬 Text</a>':'')+(j.addr?'<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(j.addr)+'" target="_blank">🗺 Map</a>':'')+'</div>'}
function card(j){
 var c=C[j.color]||C.green,b='',w=wk(j.wid);
 if(j.date){var d=new Date(j.date),n=Date.now(),k=j.status=='Paid'?'ok':d<n?'od':(d-n<864e5?'soon':'');b+='<span class="bg '+k+'">🕐 '+when(j)+'</span>'}
 if(j.notes)b+='<span class="bg">≡</span>';
 if(j.photos&&j.photos.length)b+='<span class="bg">📷 '+j.photos.length+'</span>';
 if(j.todo&&j.todo.length)b+='<span class="bg">☑ '+j.todo.filter(function(x){return x.d}).length+'/'+j.todo.length+'</span>';
 if(j.price||j.rate)b+='<span class="bg">💵 '+money(amt(j))+'</span>';
 if(j.secs||j.tStart)b+='<span class="bg tm'+(j.tStart?' run':'')+'" data-id="'+j.id+'">⏱ '+fmt(el(j))+'</span>';
 if(j.pay)b+='<span class="bg ok">✅ Paid</span>';
 return '<div class="card" data-id="'+j.id+'"><div class="lb"><span style="background:'+c[0]+'">'+c[1]+'</span></div><div class="t">'+esc(j.name)+'</div><div class="d">'+esc(j.job)+'</div>'+ct(j)+'<div class="bd">'+b+'</div>'+qa(j)+'<div class="av" style="background:'+wcol(w)+'" title="'+esc(w?w.name:'Unassigned')+'">'+(w?esc(ini(w.name)):'?')+'</div></div>';
}
function cols(){
 if(GB=='color')return Object.keys(C).map(function(k){return{v:k,t:C[k][1],d:'color:'+k,f:function(j){return j.color==k}}});
 if(GB=='wid')return W.map(function(w){return{v:w.id,t:w.name,d:'wid:'+w.id,f:function(j){return j.wid==w.id}}}).concat([{v:'',t:'Unassigned',d:'wid:',f:function(j){return !j.wid}}]);
 return S.map(function(s){return{v:s,t:s,d:'status:'+s,f:function(j){return j.status==s}}});
}
function dayLabel(date,tm){var d=new Date(date),dd=new Date(d);dd.setHours(0,0,0,0);var df=Math.round((dd.getTime()-tm)/864e5);return df==0?'Today':df==1?'Tomorrow':d.toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'})}
function renderSched(q){
 var vq=VIEW=='sched'?q:'',t0=new Date();t0.setHours(0,0,0,0);var tm=t0.getTime(),h='<div class="pg"><div class="sum">'+(ROLE=='owner'?'Schedule by worker. Hold a card and drag it to another worker to reassign it.':'Your schedule')+'</div>';
 var lanes=W.map(function(w){return{id:w.id,w:w}}).concat(ROLE=='owner'?[{id:'',w:null}]:[]);
 lanes.forEach(function(l){
  var L=J.filter(function(j){return (l.id===''?!j.wid:j.wid==l.id)&&j.status!='Paid'&&j.status!='Done'&&(j.name+j.phone+j.addr+j.job).toLowerCase().indexOf(vq)>-1});
  var groups={},keys=[];
  L.sort(function(a,b){return String(a.date||'~').localeCompare(String(b.date||'~'))}).forEach(function(j){
   var k=!j.date?'Not scheduled yet':(new Date(j.date).getTime()<tm?'Overdue':dayLabel(j.date,tm));
   if(!groups[k]){groups[k]=[];keys.push(k)}groups[k].push(j)});
  h+='<div class="lane" data-drop="wid:'+l.id+'"><h3><span class="av2" style="width:30px;height:30px;font-size:12px;background:'+wcol(l.w)+'">'+(l.w?esc(ini(l.w.name)):'?')+'</span><span style="flex:1">'+esc(l.w?l.w.name:'Unassigned')+'</span><span class="cnt">'+L.length+' job'+(L.length==1?'':'s')+'</span></h3>';
  if(!L.length)h+='<div class="m" style="padding:6px 8px 10px">Nothing scheduled. Hold a card and drag it here.</div>';
  keys.forEach(function(k){h+='<div class="dh'+(k=='Overdue'?' od':'')+'">'+k+'</div>'+groups[k].map(card).join('')});
  h+='</div>'});
 g('sched').innerHTML=h+'</div>';
}
function render(){
 var q=g('q').value.toLowerCase(),h='';
 var wo='<option value="all">All workers</option>'+W.map(function(w){return '<option value="'+w.id+'"'+(WF==w.id?' selected':'')+'>'+esc(w.name)+'</option>'}).join('')+'<option value="none"'+(WF=='none'?' selected':'')+'>Unassigned</option>';
 g('wf').innerHTML=wo;
 var vq=VIEW=='board'?q:'';
 cols().forEach(function(cl){var s=cl.v;
  var L=J.filter(function(j){return cl.f(j)&&(j.name+j.phone+j.addr+j.job).toLowerCase().indexOf(vq)>-1&&(!TODAY||isToday(j))&&(WF=='all'||(WF=='none'?!j.wid:j.wid==WF))});
  h+='<div class="list" data-drop="'+cl.d+'"><div class="lh"><span>'+esc(cl.t)+'</span><span class="cnt">'+L.length+'</span></div><div class="cs">'+L.map(card).join('')+'</div><button class="add" data-add="'+cl.d+'">+ Add a card</button></div>';
 });
 g('board').innerHTML=h;
 var open=0,due=0,paid=0,hrs=0,td=0,mi=0,fo=0;
 J.forEach(function(j){var p=amt(j);hrs+=el(j)/3600;if(j.status=='Paid'&&j.rem&&j.paidOn&&j.paidOn+Number(j.rem)*30.4*864e5<Date.now())fo++;if(j.status=='Paid')paid+=p;else{open++;if(j.status=='Done')due+=p;if(isToday(j))td++}});
 g('st').innerHTML='<span>Today: <b>'+td+'</b></span><span>Open jobs: <b>'+open+'</b></span><span>Done, unpaid: <b>'+money(due)+'</b></span><span>Paid: <b>'+money(paid)+'</b></span><span>Hours: <b>'+hrs.toFixed(1)+'</b></span><span>Follow-ups due: <b>'+fo+'</b></span>';
 renderCust(q);renderWork(q);renderSched(q);
}
function custStats(c){var L=J.filter(function(j){return j.cid==c.id}),p=0,fo=false,sc=0;L.forEach(function(j){sc+=el(j);if(j.status=='Paid'){p+=amt(j);if(j.rem&&j.paidOn&&j.paidOn+Number(j.rem)*30.4*864e5<Date.now())fo=true}});return{n:L.length,paid:p,fo:fo,secs:sc}}
function renderCust(q){
 var vq=VIEW=='cust'?q:'',L=CU.filter(function(c){return (c.name+c.phone+c.addr+(c.email||'')).toLowerCase().indexOf(vq)>-1}).sort(function(a,b){return a.name.localeCompare(b.name)});
 var h='<div class="pg"><div class="sum"><div><b style="font-size:20px">'+CU.length+'</b><br>customers</div><div><b style="font-size:20px">'+CU.filter(function(c){return custStats(c).n>1}).length+'</b><br>repeat customers</div></div>',last='';

 g('auth').style.display='none';stopListen();J.length=0;CU.length=0;W.length=0;SY={jobs:{},customers:{},workers:{}};
